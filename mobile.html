<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="image/genre/20.png">

    <title>GoChat Pro - Ultimate Edition (Spam Emoji)</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- SCRIPT JITSI UNTUK VIDEO CALL -->
    <script src="https://meet.jit.si/external_api.js"></script>
  
    <style>
    /* =========================================
        1. CSS VARIABLES & RESET
        ========================================= */
    :root {
        --bg-base: #0a0a0a;
        --glass-white: rgba(255, 255, 255, 0.03);
        --glass-thick: rgba(15, 15, 15, 0.98);
        --glass-border: rgba(255, 255, 255, 0.08);
        --accent: #d4a373; 
        --text-main: #f0f0f0;
        --text-muted: #888;
        --online: #2ecc71;
        --me-chat: linear-gradient(135deg, #d4a373 0%, #b88a5d 100%);
        --you-chat: rgba(255, 255, 255, 0.07);
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
    }

    * { 
        box-sizing: border-box; 
        -webkit-tap-highlight-color: transparent; 
        outline: none; 
        user-select: none; /* Mencegah seleksi teks global untuk UX native-like */
    }
    
    body { 
        margin: 0; 
        font-family: 'Inter', sans-serif; 
        background: var(--bg-base); 
        color: var(--text-main); 
        height: 100dvh; 
        overflow: hidden; 
    }
    
    .app { 
        display: flex; 
        height: 100%; 
        width: 100%; 
        position: relative; 
    }

    /* =========================================
        2. SIDEBAR STYLES
        ========================================= */
    .sidebar { 
        width: 30%; 
        min-width: 320px; 
        border-right: 1px solid var(--glass-border); 
        display: flex; 
        flex-direction: column; 
        transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        z-index: 200; 
        padding-top: var(--safe-top); 
        background: var(--bg-base); 
    }
    
    .side-header { 
        padding: 20px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-bottom: 1px solid var(--glass-border); 
        position: relative; 
        z-index: 10; 
    }
    
    .my-avatar { 
        width: 45px; 
        height: 45px; 
        border-radius: 14px; 
        object-fit: cover; 
        cursor: pointer; 
        border: 1px solid var(--glass-border); 
        transition: transform 0.2s;
    }
    .my-avatar:active { transform: scale(0.9); }
    
    .search-container { 
        padding: 15px 20px; 
    }
    
    .search-box { 
        background: var(--glass-white); 
        border-radius: 15px; 
        padding: 12px; 
        display: flex; 
        align-items: center; 
        gap: 10px; 
        border: 1px solid var(--glass-border); 
    }
    
    .search-box input { 
        background: transparent; 
        border: none; 
        color: white; 
        width: 100%; 
        font-size: 14px; 
    }
    
    #users { 
        flex: 1; 
        overflow-y: auto; 
        padding: 10px; 
        scrollbar-width: none; /* Sembunyikan scrollbar standar untuk custom style */
    }
    /* Custom Scrollbar untuk Webkit */
    #users::-webkit-scrollbar { width: 5px; }
    #users::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    
    .user { 
        padding: 14px; 
        border-radius: 18px; 
        display: flex; 
        align-items: center; 
        gap: 14px; 
        cursor: pointer; 
        margin-bottom: 8px; 
        transition: background 0.2s; 
        position: relative; 
    }
    
    .user:hover { 
        background: var(--glass-white); 
    }
    
    .user img { 
        width: 52px; 
        height: 52px; 
        border-radius: 16px; 
        object-fit: cover; 
        pointer-events: none;
    }
    
    .user-info { 
        flex: 1; 
        min-width: 0; 
    }
    
    .user-info b { 
        display: block; 
        font-size: 15px; 
        color: #fff; 
        margin-bottom: 2px; 
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    .user-info span { 
        font-size: 12px; 
        color: var(--text-muted); 
        display: block; 
        white-space: nowrap; 
        overflow: hidden; 
        text-overflow: ellipsis; 
    }
    
    .unread-badge { 
        background: var(--accent); 
        color: #000; 
        min-width: 20px; 
        height: 20px; 
        border-radius: 10px; 
        font-size: 10px; 
        font-weight: bold; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 0 6px; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* =========================================
        3. CHAT AREA STYLES
        ========================================= */
    .chat { 
        flex: 1; 
        display: flex; 
        flex-direction: column; 
        background: var(--glass-thick); 
        position: relative; 
        padding-top: var(--safe-top); 
    }
    
    .chat-header { 
        height: 70px; 
        padding: 0 20px; 
        display: flex; 
        align-items: center; 
        gap: 15px; 
        border-bottom: 1px solid var(--glass-border); 
        backdrop-filter: blur(20px); 
        z-index: 10; 
        background: rgba(10,10,10,0.8); 
        transition: background 0.3s;
    }

    .msgs { 
        flex: 1; 
        overflow-y: auto; 
        padding: 20px; 
        display: flex; 
        flex-direction: column; 
        gap: 12px; 
        scroll-behavior: smooth; 
        background: radial-gradient(circle at center, #111 0%, #0a0a0a 100%);
        scrollbar-width: none;
    }
    
    .msg-wrap { 
        display: flex; 
        flex-direction: column; 
        max-width: 75%; 
        position: relative; 
        margin-bottom: 2px;
    }
    
    .msg-wrap.me { 
        align-self: flex-end; 
        align-items: flex-end; 
    }
    
    .msg-wrap.you { 
        align-self: flex-start; 
        align-items: flex-start; 
    }

    .msg { 
        padding: 10px 14px; 
        border-radius: 18px; 
        font-size: 15px; 
        word-wrap: break-word; 
        animation: fadeIn 0.3s ease;
        position: relative;
        line-height: 1.4;
        user-select: text;
    }
    
    @keyframes fadeIn { 
        from { opacity: 0; transform: translateY(10px); } 
        to { opacity: 1; transform: translateY(0); } 
    }
    
    .me .msg { 
        background: var(--me-chat); 
        color: #000; 
        border-bottom-right-radius: 4px; 
    }
    
    .you .msg { 
        background: var(--you-chat); 
        color: white; 
        border-bottom-left-radius: 4px; 
        border: 1px solid var(--glass-border); 
    }
    
    .msg-meta { 
        display: flex; 
        align-items: center; 
        gap: 4px; 
        font-size: 10px; 
        opacity: 0.7; 
        margin-top: 4px; 
        margin-right: 2px;
        font-variant-numeric: tabular-nums;
    }
    
    .msg img { 
        max-width: 100%; 
        border-radius: 10px; 
        margin-top: 5px; 
        cursor: pointer; 
        display: block;
    }

    .del-btn { 
        font-size: 10px; 
        color: #ff5e5e; 
        cursor: pointer; 
        opacity: 0; 
        transition: 0.2s; 
        margin-top: 2px; 
    }
    
    .msg-wrap:hover .del-btn { 
        opacity: 1; 
    }
    
    .deleted { 
        font-style: italic; 
        opacity: 0.5; 
    }

    /* Voice Note Player Styling */
    audio { 
        height: 35px; 
        filter: invert(1) hue-rotate(180deg); 
        max-width: 210px; 
        margin-top: 5px; 
        border-radius: 15px;
    }
    
    /* Call Message Style */
    .call-msg { 
        text-align: center; 
        font-size: 13px; 
        background: rgba(212, 163, 115, 0.1); 
        padding: 15px; 
        border-radius: 15px; 
        margin: 5px 0; 
        color: var(--accent); 
        border: 1px dashed var(--accent); 
        cursor: pointer; 
        font-weight: 600;
    }
    .call-msg:active { background: rgba(212, 163, 115, 0.2); }

    /* =========================================
        4. INPUT AREA & RECORDING
        ========================================= */
    .input-area { 
        padding: 10px 2px; /* Padding samping sangat tipis untuk HP */
        background: var(--bg-base); 
        border-top: 1px solid var(--glass-border); 
        /* Padding bawah 30px agar tidak kepotong Home Bar */
        padding-bottom: calc(30px + env(safe-area-inset-bottom)); 
        position: relative;
        min-height: 60px; 
    }

    .input-row { 
        display: flex; 
        align-items: center; 
        gap: 4px; 
        background: var(--glass-white); 
        padding: 10px 2px; /* Padding samping dijadikan 2px supaya benar-benar mepet */
        border-radius: 25px; 
        border: 1px solid var(--glass-border);
        min-height: 45px;
        width: 100%; /* Pastikan lebar 100% */
        transition: box-shadow 0.2s;
    }
    .input-row:focus-within {
        box-shadow: 0 0 0 2px rgba(212, 163, 115, 0.1);
        border-color: var(--accent);
    }

    /* RECORDING UI */
    #recording-ui {
        display: none; 
        align-items: center;
        justify-content: space-between;
        width: 100%; 
        flex: 1; /* PENTING: Memaksa elemen ini mengisi sisa ruang kosong */
        background: transparent; 
        padding: 0px 2px; /* Padding vertikal dan horizontal dijadikan 0/2px */
        border-radius: 12px;
        pointer-events: none; 
        position: relative;
        z-index: 10;
        overflow: visible; /* Supaya animasi bisa keluar dikit */
    }

    /* RECORD INFO (Timer Kiri) */
    .record-info {
        color: #ff5e5e;
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px; /* Dikit diperkecil lagi */
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        flex-shrink: 0; /* JANGAN DIKECILKAN otomatis, biarkan timer tetap utuh */
    }

    /* INSTRUKSI SLIDE (KANAN) */
    #slide-instruction {
        color: #888;
        font-size: 9px; 
        animation: slideLeft 1.5s infinite;
        display: flex;
        align-items: center;
        justify-content: flex-end; /* Rata kanan */
        gap: 2px;
        
        /* PENTING: INI YANG MENCEGAH KELEBARAN */
        max-width: 45%; /* Batasi lebar maksimal hanya 45% layar HP */
        white-space: nowrap; /* Jangan turun ke baris bawah */
        overflow: hidden; /* Sembunyikan teks yang kepanjangan */
        text-overflow: ellipsis; /* Tampilkan titik-titik (...) jika kepanjangan */
    }

    /* KHUSUS LAPTOP (AGAR KEMBALI BAGUS) */
    @media (min-width: 769px) {
        .input-row {
            gap: 10px; 
            padding: 10px 15px;
        }

        #slide-instruction {
            font-size: 13px;
            max-width: 60%; /* Di laptop boleh lebih lebar */
            white-space: nowrap; /* Tetap satu baris */
        }
    }
        
    #text { 
        flex: 1; 
        border: none; 
        background: transparent; 
        color: white; 
        padding: 8px 2px; /* Padding atas bawah disesuaikan agar rapi */
        font-size: 16px; /* Tetap 16px agar tidak zoom */
        user-select: text;
    }
    
    .btn-action { 
        background: none; 
        border: none; 
        color: var(--text-muted); 
        font-size: 20px; 
        cursor: pointer; 
        margin: 0 2px;
        transition: color 0.2s, transform 0.1s;
    }
    .btn-action:active { transform: scale(0.9); color: white; }

    /* =========================================
        5. EMOJI PANEL (KATEGORI BANYAK)
        ========================================= */
    #emojiPanel {
        display: none; 
        position: absolute; 
        bottom: 85px; 
        left: 15px; 
        right: 15px;
        background: #1a1a1a; 
        border: 1px solid var(--glass-border); 
        border-radius: 20px;
        padding: 0; /* Padding 0 karena kita pakai header tabs sendiri */
        max-height: 350px; /* Tinggi maksimal agar tidak nutupin layar penuh */
        z-index: 1000; 
        box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        pointer-events: auto;
    }

    /* Header Panel (Tombol Tutup & Kategori) */
    .emoji-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 15px;
        border-bottom: 1px solid var(--glass-border);
        background: #222;
        border-radius: 20px 20px 0 0;
    }

    .emoji-close-btn {
        color: #ff5e5e;
        font-size: 16px;
        cursor: pointer;
        padding: 5px;
        border-radius: 50%;
        transition: background 0.2s;
    }
    .emoji-close-btn:hover { background: rgba(255, 94, 94, 0.2); }

      /* =========================================
       PERBAIKAN EMOJI PANEL (GANTI BLOK LAMA)
       ========================================= */
    #emojiTabsContainer {
        display: flex;
        overflow-x: auto;
        padding: 10px;
        background: #161616;
        border-bottom: 1px solid var(--glass-border);
    }
    
    /* SCROLLBAR TAB (HORIZONTAL) - SEKARANG TERLIHAT */
    #emojiTabsContainer::-webkit-scrollbar { height: 4px; }
    #emojiTabsContainer::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
    #emojiTabsContainer::-webkit-scrollbar-thumb:hover { background: #777; }
    #emojiTabsContainer::-webkit-scrollbar-track { background: transparent; }

    #emojiGridContainer {
        overflow-y: auto;
        padding: 10px;
        flex: 1;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
        gap: 8px;
        height: 220px;
    }
    
    /* SCROLLBAR GRID (VERTIKAL) */
    #emojiGridContainer::-webkit-scrollbar { width: 5px; }
    #emojiGridContainer::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    #emojiGridContainer::-webkit-scrollbar-track { background: transparent; }
    
    .emoji-item { 
        font-size: 24px; 
        text-align: center; 
        cursor: pointer; 
        padding: 5px; 
        border-radius: 8px; 
        transition: background 0.1s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1 / 1; /* Agar kotak persegi sempurna */
    }
    
    .emoji-item:hover { 
        background: var(--glass-white); 
        transform: scale(1.2); 
    }
    .emoji-item:active { 
        background: rgba(255,255,255,0.1); 
        transform: scale(0.9); 
    }

    /* Tombol Send */
    .btn-send { 
        background: var(--accent); 
        border: none; 
        width: 38px; 
        height: 38px; 
        border-radius: 50%; 
        color: black; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        flex-shrink: 0; 
        transition: transform 0.1s;
    }
    .btn-send:active { transform: scale(0.9); }

    /* Toast Standar */
    #toast { 
        position: fixed; top: 40px; left: 50%; transform: translateX(-50%); 
        background: var(--accent); color: black; padding: 10px 20px; 
        border-radius: 20px; z-index: 9999; display: none; font-weight: bold; 
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    /* Modals */
    .modal {
        display: none; 
        position: fixed; 
        inset: 0; 
        background: rgba(0,0,0,0.9); 
        z-index: 3000; 
        align-items: center; 
        justify-content: center;
        backdrop-filter: blur(5px);
    }
    .modal-content { 
        background: #161616; padding: 30px; border-radius: 25px; 
        width: 85%; max-width: 350px; text-align: center; border: 1px solid var(--glass-border);
    }

    @media (max-width: 768px) {
        .sidebar { width: 100%; position: absolute; height: 100%; left: 0; top: 0; }
        .sidebar.hidden { transform: translateX(-100%); }
        .chat { width: 100%; }
    }

    /* Message Context Menu */
    .msg-context-menu {
        display: none; position: fixed; z-index: 2000;
        background: #1a1a1a; border: 1px solid var(--glass-border);
        border-radius: 15px; width: 170px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .menu-item {
        padding: 12px 15px; font-size: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
    .menu-item:hover { background: var(--glass-white); color: var(--accent); }
    .menu-item.danger { color: #ff5e5e; }

    /* Reply Preview */
    #reply-preview {
        display: none; 
        padding: 10px 12px; 
        background: #1a1a1a; 
        border-left: 4px solid var(--accent); 
        border-top: 1px solid var(--glass-border);
        margin: 0; 
        position: absolute;
        bottom: 100%; 
        left: 0;
        right: 0;
        z-index: 5;
        animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    .forward-tag { font-size: 10px; opacity: 0.6; font-style: italic; margin-bottom: 3px; }
    
    /* Action Sheet Hapus */
    .action-sheet-overlay {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
        z-index: 3000; align-items: flex-end;
    }
    .action-sheet {
        width: 100%; background: #1a1a1a; border-top-left-radius: 20px; border-top-right-radius: 20px;
        padding: 20px; animation: slideUp 0.3s ease-out;
    }
    .sheet-header { color: #888; text-align: center; margin-bottom: 15px; font-size: 14px; }
    .sheet-btn {
        width: 100%; padding: 15px; border: none; border-radius: 12px; margin-bottom: 10px;
        font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .sheet-btn.danger { background: #ff4757; color: white; }
    .sheet-btn.cancel { background: #333; color: white; }

    /* Sidebar Context Menu */
    .context-menu {
        position: fixed !important;
        display: none;
        background: #1a1a1a !important; 
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        border-radius: 12px !important;
        width: 180px !important;
        z-index: 9999999 !important; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.9) !important;
        overflow: hidden !important;
        padding: 5px 0 !important;
    }
    .context-menu-item {
        padding: 12px 16px !important;
        font-size: 14px !important;
        color: #ffffff !important;
        display: flex !important;
        align-items: center !important;
        gap: 12px !important;
        cursor: pointer !important;
        background: transparent !important;
        transition: 0.2s;
    }
    .context-menu-item:hover { background: rgba(255, 255, 255, 0.1) !important; }
    .context-menu-item i { width: 20px !important; text-align: center !important; color: #d4af37 !important; }
    .context-menu-item.danger { color: #ff5e5e !important; }
    .context-menu-item.danger i { color: #ff5e5e !important; }

    /* Recording Animation */
    .blink { animation: blink-red 1s infinite; }
    @keyframes blink-red { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

    @keyframes slideLeft {
        0% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(-15px); opacity: 0.2; }
    }

    #normal-input { transition: all 0.2s ease; }
    .btn-action, #micButton { cursor: pointer; user-select: none; }
    
    .vn-player { max-width: 200px; height: 35px; border-radius: 20px; filter: sepia(20%) saturate(70%) grayscale(1); }
    .fa-users, .fa-user-plus { position: relative; z-index: 10; }

    /* =========================================
        6. MODAL VIDEO CALL & OVERLAY (JITSI)
        ========================================= */
    #videoCallModal {
        display: none; 
        position: fixed; 
        inset: 0; 
        background: #000; 
        z-index: 10000000; 
        width: 100%; 
        height: 100%;
        padding-top: env(safe-area-inset-top); 
        padding-bottom: env(safe-area-inset-bottom);
    }
    #jitsi-container { width: 100%; height: 100%; display: none; }

    #call-overlay {
        display: none; 
        position: fixed; 
        inset: 0; 
        background: #000; 
        z-index: 10000000; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        text-align: center; 
        color: white; 
        overflow: hidden;
    }
    .call-bg-anim {
        position: absolute; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%, -50%); 
        width: 200px; 
        height: 200px; 
        border-radius: 50%; 
        background: radial-gradient(circle, rgba(46, 204, 113, 0.4) 0%, rgba(0,0,0,0) 70%); 
        animation: pulse-ring 2s infinite; 
        z-index: 1; 
    }
    .call-bg-anim:nth-child(2) { animation-delay: 0.5s; }
    .call-bg-anim:nth-child(3) { animation-delay: 1s; }
    @keyframes pulse-ring {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; } 
        100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    }
    .call-avatar {
        width: 150px; 
        height: 150px; 
        border-radius: 50%; 
        object-fit: cover; 
        border: 4px solid var(--accent); 
        z-index: 2; 
        margin-bottom: 20px; 
        animation: float 3s ease-in-out infinite;

    categories.forEach(cat => {

function renderEmojiGrid(category) {
    currentEmojiCategory = category;
    
    // Update style tab active
    document.querySelectorAll('.emoji-tab').forEach(t => t.classList.remove('active'));
    // Cari tab yang sesuai dan kasih active
    const tabs = document.querySelectorAll('.emoji-tab');
    tabs.forEach(t => { if(t.innerText === emojiIcons[category]) t.classList.add('active'); });

    // Render Grid
    const grid = document.getElementById('emojiGridContainer');
    grid.innerHTML = "";
    
    emojiCategories[category].forEach(emojiChar => {
        const el = document.createElement("div");
        el.className = "emoji-item";
        el.innerText = emojiChar;
        
        // --- LOGIKA TOMBOL (STOP PROPAGATION) ---
        el.onclick = (e) => {
            // 1. Mencegah event naik ke document/body
            e.stopPropagation(); 
            
            // 2. Masukkan Emoji ke Input
            textInput.value += emojiChar;
            
            // 3. Fokus tetap agar bisa spam
            textInput.focus();
            
            // 4. Get posisi scroll
            const rect = grid.getBoundingClientRect();
            // Scroll ke elemen baris agar user bisa spam emoji tanpa scroll manual
            el.scrollIntoView({ block: 'center', behavior: 'instant', block: 'nearest' });

        grid.appendChild(el);

}

    if (contactsListener) { db.ref(`user_chats/${currentUser}`).off('value', contactsListener); }

            items.push({ id: c.key, info: info });

        // Sorting
        items.sort((a, b) => b.info.time - a.info.time);

        // Render
        items.forEach(item => {
            const isGrp = item.id.startsWith("GROUP_");
            const refPath = isGrp ? "groups/" + item.id : "users/" + item.id;
            
            db.ref(refPath).once("value", uSnap => {

    if (activeChatRef) { activeChatRef.off(); }

    isGroup = grp;
    currentChatId = grp ? pId : [currentUser, pId].sort().join("_");
    activeChatRef = db.ref("chats/" + currentChatId).limitToLast(50);
    
    // Reset Flag View Once
    viewOnceIgnoredKey = null; 
    selectedMsgId = null; selectedMsgData = null;
    
    document.getElementById("emojiPanel").style.display = "none";
    if (window.innerWidth <= 768) document.getElementById("sidebar").classList.add("hidden");

    activeChatRef.on("child_added", snap => {
        renderMessage(snap.val(), snap.key);
        msgsDiv.scrollTop = msgsDiv.scrollHeight;
        if(snap.val().from !== currentUser && !snap.val().seen) { db.ref("chats/" + currentChatId + "/" + snap.key).update({ seen: true }); }
    });

    activeChatRef.on("child_changed", snap => {
        const key = snap.key;
        // Jika key ini viewOnceIgnoreKey, maka jangan re-render (agar UI tidak hilang)
        if (key === viewOnceIgnoredKey) {
            viewOnceIgnoredKey = null;

        }
        const oldMsg = document.getElementById("msg-wrap-" + key);
        if(oldMsg) { oldMsg.remove(); renderMessage(snap.val(), key); }

function renderMessage(m, key) {
    if (document.getElementById("msg-wrap-" + key)) return;
    const isMe = m.from === currentUser;
    const wrap = document.createElement("div");
    wrap.className = `msg-wrap ${isMe ? 'me' : 'you'}`;
    wrap.id = "msg-wrap-" + key;
    
    // Touch Logic
    let touchStartX, touchStartY, touchTimer;
    wrap.oncontextmenu = (e) => { e.preventDefault(); openContextMenu(e, key, m); };
    wrap.addEventListener('touchstart', (e) => {
        const touch = e.touches[0]; touchStartX = touch.clientX; touchStartY = touch.clientY;
        if (touchTimer) clearTimeout(touchTimer);
        touchTimer = setTimeout(() => { openContextMenu({ clientX: touchStartX, clientY: touchStartY, preventDefault: () => {} }, key, m); }, 600);
    }, { passive: false });
    wrap.addEventListener('touchmove', (e) => {
        if (!touchTimer) return;
        const touch = e.touches[0];
        if (Math.abs(touch.clientX - touchStartX) > 10 || Math.abs(touch.clientY - touchStartY) > 10) { clearTimeout(touchTimer); touchTimer = null; }
    }, { passive: false });
    wrap.addEventListener('touchend', () => { clearTimeout(touchTimer); touchTimer = null; });

    // Body Message
    let content = "";
    if (m.deleted) {
        content = `<div class="msg deleted">🚫 Pesan telah dihapus</div>`;
    } else {
        let textBody = "";
        try {
            if (m.text.startsWith("IMG:")) {
                let url = "";
                try { url = decryptData(m.text.replace("IMG:", "")); } catch(e) { url = null; }
                // VIEW ONCE LOGIC
                if (m.viewOnce) {
                    textBody = `
                        <div class="view-once-blur" onclick="openViewOnceMessage('${key}')">
                            <img src="${url}" style="width:100%; display:block; filter:blur(25px);">
                            <div class="view-once-overlay">
                                <i class="fas fa-eye" style="font-size:30px;"></i>
                                <div style="font-size:12px;">Klik untuk melihat</div>
                            </div>
                        </div>`;
                } else {
                    textBody = `<img src="${url}" onclick="openLightbox('${url}')" style="max-width:100%; border-radius:10px; cursor:pointer;">`;
                }
            } 
            else if (m.text.startsWith("TYPE:VN:")) {
                const url = decryptData(m.text.replace("TYPE:VN:", ""));
                textBody = `<div class="vn-container" style="display:flex; align-items:center; gap:8px; padding:5px 0;"><audio src="${url}" controls class="vn-player" style="max-width:200px; height:30px;"></audio></div>`;
            } 
            else if (m.text.startsWith("CALL_JITSI:")) {
                const p = m.text.split(":");
                textBody = `<div class="call-msg" onclick="joinVideoCall('${p[2]}', '${p[1]}')"><i class="fas fa-video"></i><br><small>Panggilan Masuk (Klik Gabung)</small></div>`;
            }
            else {
                textBody = `<span>${decryptData(m.text)}</span>`;
            }
        } catch (e) { textBody = `<span style="color:red; font-size:10px;">Gagal dekripsi</span>`; }

        const editedLabel = m.edited ? `<small style="opacity:0.5; font-size:9px; margin-left:5px;">(diedit)</small>` : "";

        content = `<div class="msg">${textBody}${editedLabel}</div>`;
    }

    // Footer (Time & Ticks)
    const time = new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    let statusIcons = "";
    if (isMe && !m.deleted) {
        if (isGroup) {
            const seenByCount = m.seenBy ? Object.keys(m.seenBy).length : 0;
            const totalMembers = groupMembersCount[currentChatId] || 2;
            statusIcons = seenByCount >= totalMembers ? `<span style="color:var(--accent); font-weight:bold;">✓✓</span>` : `✓`;
        } else {
            statusIcons = m.seen ? `<span style="color:var(--accent); font-weight:bold;">✓✓</span>` : `✓`;
        }
    }
    
    const senderName = (isGroup && !isMe && !m.deleted) ? `<div style="font-size:10px; font-weight:bold; color:var(--accent); margin-bottom:2px;">${m.from}</div>` : "";
    
    wrap.innerHTML = `${senderName}${content}<div class="msg-meta" style="display:flex; align-items:center; gap:4px; justify-content:flex-end; font-size:10px; opacity:0.7; margin-top:2px;">${time} ${statusIcons}</div>`;
    
    msgsDiv.appendChild(wrap);
    msgsDiv.scrollTop = msgsDiv.scrollHeight; 

    // Logic Seen (Group vs Personal)
    if (!isMe && currentChatId) {
        if (isGroup) {
            if (!m.seenBy || !m.seenBy[currentUser]) db.ref(`chats/${currentChatId}/${m.key}/seenBy/${currentUser}`).set(true);
        } else {
            if (!m.seen) db.ref("chats/" + currentChatId + "/" + m.key).update({ seen: true });
        }
    }
}

/* =========================================
    SEND FUNCTIONS
    ========================================= */
async function send() {
    const val = textInput.value.trim();
    if (!currentChatId) return; 
    
    if (pendingImageBase64) {
        const msgObj = { from: currentUser, text: "IMG:" + encryptData(pendingImageBase64), time: Date.now(), seenBy: { [currentUser]: true } };
        if (isViewOnceEnabled) msgObj.viewOnce = true;
        if (replyData) msgObj.replyTo = replyData;
        db.ref("chats/" + currentChatId).push(msgObj).then(() => { showToast("Gambar terkirim!"); closeSendImagePreview(); });
        return;
    }

    if (vnBlob) {
        showToast("Mengirim VN...");
        const reader = new FileReader();
        reader.readAsDataURL(vnBlob);
        reader.onloadend = function() {
            const encryptedVN = "TYPE:VN:" + encryptData(reader.result);
            const msgObj = { from: currentUser, text: encryptedVN, time: Date.now(), seenBy: { [currentUser]: true } };
            if (replyData) msgObj.replyTo = replyData;
            db.ref("chats/" + currentChatId).push(msgObj);
            updateSummary("🎤 VN Terkirim!");
            vnBlob = null; textInput.value = "";
            cancelReply();
        };
        return;
    }

    // Edit
    if (isEditing) {
        if (!val) return;
        db.ref(`chats/${currentChatId}/${selectedMsgId}`).update({
            text: encryptData(val),
            edited: true
        }).then(() => {
            isEditing = false; textInput.value = "";
            showToast("Pesan diperbarui");
        });
    } 
    else {
        if (!val) return;
        const msgObj = {
            from: currentUser, text: encryptData(val), time: Date.now(), seenBy: { [currentUser]: true } 
            msgObj.seen = false;
            if (replyData) msgObj.replyTo = replyData;
            db.ref("chats/" + currentChatId).push(msgObj).then(() => { textInput.value = ""; updateSummary(val); cancelReply(); });
    }
    db.ref(`typing/${currentChatId}/${currentUser}`).remove();
}

    if (sound) {
        sound.currentTime = 0;

function showAppToast(title, body, photo, chatId) {
    const container = document.getElementById("custom-toast-container");
    const card = document.createElement("div");
    card.id = "custom-toast-card";
    card.onclick = () => {
        const isGrp = chatId.startsWith("GROUP_");
        const refPath = isGrp ? "groups/" + chatId : "users/" + chatId;
        db.ref(refPath).once("value", uSnap => {

    container.innerHTML = "";

}

function showBrowserNotification(title, body, icon, tag) {

    globalNotifListener = db.ref(`user_chats/${currentUser}`).on("value", (snap) => {
        snap.forEach((child) => {
            const chatId = child.key.startsWith("GROUP_") ? child.key : [currentUser, child.key].sort().join("_");
            db.ref(`chats/${chatId}`).limitToLast(20).on("child_added", (msgSnap) => {

                    let notifBody = "";
                    let soundType = 'message';
                    
                    if (m.text.startsWith("CALL_JITSI:")) {
                        const p = m.text.split(":");
                        const callType = p[1]; const roomName = p[2];
                        notifBody = (callType === 'audio') ? "📞 Panggilan Suara..." : "📹 Panggilan Video...";
                        showCallOverlay(roomName, callType, notifTitle, u?.photo);
                    } 
                    else if (m.text.startsWith("IMG:")) { notifBody = "📷 Mengirim Gambar..."; } 
                    else if (m.text.startsWith("TYPE:VN:")) { notifBody = "🎤 Mengirim Voice Note..."; }
                    else { try { notifBody = decryptData(m.text); } catch(e) { notifBody = "Pesan baru"; } }
                    
                    playNotificationSound(soundType);
                    if (document.visibilityState === 'visible') showAppToast(notifTitle, notifBody, u?.photo, child.key);
                    showBrowserNotification(notifTitle, notifBody, u?.photo, `chat_${chatId}`);

}

function openChat(pId, photo, name, grp = false) {
    if (activeChatRef) { activeChatRef.off(); }
    currentPartnerId = pId;
    isGroup = grp;
    currentChatId = grp ? pId : [currentUser, pId].sort().join("_");
    activeChatRef = db.ref("chats/" + currentChatId).limitToLast(50);

    // Reset Flags
    viewOnceIgnoredKey = null; 
    selectedMsgId = null; 
    selectedMsgData = null;
    
    document.getElementById("emojiPanel").style.display = "none";
    if (window.innerWidth <= 768) document.getElementById("sidebar").classList.add("hidden");
    document.getElementById("welcome-screen").style.display = "none";
    document.getElementById("chat-header-area").style.display = "flex";
    document.getElementById("msgs").style.display = "flex";
    document.getElementById("inputArea").style.display = "block";

    document.getElementById("chatName").innerText = name;
    document.getElementById("chatAvatar").src = photo || (grp ? "https://cdn-icons-png.flaticon.com/512/615/615075.png" : "https://cdn-icons-png.flaticon.com/512/149/149071.png");

    const msgsDiv = document.getElementById("msgs");
    msgsDiv.innerHTML = "";

    activeChatRef.on("child_added", snap => {
        renderMessage(snap.val(), snap.key);
        msgsDiv.scrollTop = msgsDiv.scrollHeight;
        if(snap.val().from !== currentUser && !snap.val().seen) { db.ref("chats/" + currentChatId + "/" + snap.key).update({ seen: true }); }
    });

    activeChatRef.on("child_changed", snap => {
        const key = snap.key;
        if (key === viewOnceIgnoredKey) { viewOnceIgnoredKey = null; return; }
        const oldMsg = document.getElementById("msg-wrap-" + key);
        if(oldMsg) { oldMsg.remove(); renderMessage(snap.val(), key); }
    });

    watchTyping(currentChatId);
    if(!grp) { updatePartnerOnlineStatus(); } 
    else { 
        document.getElementById("chatStatus").innerText = "Grup Chat"; document.getElementById("chatStatus").style.color = "var(--text-muted)"; 
        isEditing = false; cancelReply();
        db.ref("group_members/" + pId).once("value", snap => { groupMembersCount[pId] = snap.numChildren(); });
    }
}

/* =========================================
    RECORDING LOGIC (FIXED SLIDE TO CANCEL & WAKELOCK)
    ========================================= */
async function handleStart(e) {
    if (e.cancelable) e.preventDefault();
    startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
    isCancelled = false;

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = event => { if (event.data.size > 0) audioChunks.push(event.data); };
        mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            if (!isCancelled && audioChunks.length > 0) {
                const vnBlob = new Blob(audioChunks, { type: 'audio/webm' });
                showToast("Mengirim VN...");
                const formData = new FormData(); 
                formData.append('file', vnBlob); 
                formData.append('upload_preset', 'hanung'); 
                formData.append('resource_type', 'video'); 
                try {
                    const response = await fetch('https://api.cloudinary.com/v1_1/dwu8dbfjp/video/upload', { method: 'POST', body: formData });
                    const data = await response.json();
                    if (data.secure_url) {
                        const encryptedURL = encryptData(data.secure_url);
                        const finalMessage = "TYPE:VN:" + encryptedURL;
                        db.ref("chats/" + currentChatId).push({ from: currentUser, text: finalMessage, time: Date.now() });
                        showToast("VN Terkirim!");
                    } else { showToast("Gagal upload VN."); }
                } catch (error) { console.error(error); showToast("Error koneksi server."); }
            }
            toggleRecordingUI(false);
        };

        mediaRecorder.start();
        toggleRecordingUI(true);
        startTimer();
    } 

    async function handleStart(e) {
        // Gunakan referensi variable global agar lebih bersih
        // (Kode di atas menggunakan DOM variable di luar fungsi ini sudah didefinisikan)
        if (e.cancelable) e.preventDefault();
        startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
        isCancelled = false;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };
            
            mediaRecorder.onstop = async () => {
                stream.getTracks().forEach(t => t.stop());

                if (!isCancelled && audioChunks.length > 0) {
                    const vnBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    showToast("Mengirim VN...");
                    const formData = new FormData();
                    formData.append('file', vnBlob);
                    formData.append('upload_preset', 'hanung'); 
                    formData.append('resource_type', 'video'); 
                    try {
                        const response = await fetch('https://api.cloudinary.com/v1_1/dwu8dbfjp/video/upload', { method: 'POST', body: formData });
                        const data = await response.json();
                        if (data.secure_url) {
                            const encryptedURL = encryptData(data.secure_url);
                            const finalMessage = "TYPE:VN:" + encryptedURL;
                            db.ref("chats/" + currentChatId).push({ from: currentUser, text: finalMessage, time: Date.now() });
                            showToast("VN Terkirim!");
                        } else { showToast("Gagal upload VN."); }
                    } catch (error) { console.error(error); showToast("Error koneksi."); }
                }
                toggleRecordingUI(false);
            };
            
            mediaRecorder.start();
            toggleRecordingUI(true);
            startTimer();
        } catch (err) {
        console.error(err);
        toggleRecordingUI(false);
    }

    function toggleRecordingUI(isRecording) {
        const normalInput = document.getElementById("normal-input");
        const recordingUI = document.getElementById("recording-ui");
        const sendButton = document.getElementById("sendButton");
        const micButton = document.getElementById("micButton");

        const isMobile = window.innerWidth <= 768;

        if (isRecording) {
            if (isMobile) {
                if(normalInput) normalInput.style.display = 'none';
                if(sendButton) sendButton.style.display = 'none';
            } else {
                if(normalInput) { normalInput.style.opacity = '0'; normalInput.style.pointerEvents = 'none'; if(sendButton) sendButton.style.display = 'none';
            }
            if(recordingUI) recordingUI.style.display = 'flex';
            if(micButton) micBtn.style.color = '#ff5e5e';
        } else {
            clearInterval(recordInterval);
            const timerDisplay = document.getElementById('record-timer');
            if(timerDisplay) timerDisplay.innerText = "00:00";
            
            if (recordingUI) recordingUI.style.display = 'none';
            if (isMobile) { if(normalInput) normalInput.style.display = 'flex'; if(sendButton) sendButton.style.display = 'flex'; }
            else { if(normalInput) { normalInput.style.opacity = '1'; normalInput.style.pointerEvents = 'auto'; if(sendButton) sendButton.style.display = 'block'; }
            if(micButton) micBtn.style.color = '';
        }
    }

    function startTimer() {
        let sec = 0, min = 0; const timerDisplay = document.getElementById('record-timer');
        if (!timerDisplay) return;
        if (recordInterval) clearInterval(recordInterval);
        recordInterval = setInterval(() => {
            sec++; if (sec == 60) { min++; sec = 0; } timerDisplay.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`; 
        }, 1000);
    }

    function handleMove(e) {
        if (!mediaRecorder || mediaRecorder.state !== "recording") return;
        let currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
        let diffX = startX - currentX;
        const instruction = document.getElementById('slide-instruction');
        if (diffX > 60) {
            isCancelled = true;
            if(instruction) { 
                instruction.innerHTML = "<i class='fas fa-trash'></i> Batalkan"; 
                instruction.style.color = "#ff5e5e"; 
            }
        } else {
            isCancelled = false;
            if(instruction) { 
                instruction.innerHTML = "<i class='fas fa-chevron-left'></i> Geser Batal"; 
                instruction.style.color = "#888"; 
            }
        }
    }

    function handleStop() {
        if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); } else { toggleRecordingUI(false); }
    }
    // Event Listeners Recording
    if(micBtn) {
        micBtn.addEventListener('mousedown', handleStart);
        micBtn.addEventListener('touchstart', handleStart, {passive: false});
        micBtn.addEventListener('touchmove', handleMove, {passive: false});
        micBtn.addEventListener('touchend', handleStop);
    }
    window.addEventListener('mouseup', () => { if (mediaRecorder && mediaRecorder.state === "recording") handleStop(); });

        renderEmojiTabs('Smileys');
        renderEmojiGrid('Smileers');
    }
}

    // Fungsi Tab (Render Tab Grid)
    function renderEmojiGrid(cat) {
        const emojis = emojiCategories[cat] || [];
        emojiGrid.innerHTML = "";
        
        emojis.forEach(emojiChar => {
            const el = document.createElement("div");
            el.className = "emoji-item";
            el.innerText = emojiChar;
            
            // --- LOGIKA STOPPROPAGATION (AGAR TETAP PANEL TIDAK OTOMATIS) ---
            el.onclick = (e) => {
                // Mencegah event naik ke parent container agar tidak tembus ke document
                e.stopPropagation();
                
                // Masukkan Emoji
                textInput.value += emojiChar;
                
                // Fokus Input
                textInput.focus();
                
                // Opsional: Scroll ke elemen emoji (Opsional)
                // elem.scrollIntoView({ block: 'center', behavior: 'instant', block: 'nearest' });
            };
            
            grid.appendChild(el);
        });
        
        // Auto scroll ke bawah
        // grid.scrollTop = 0;
    }

// Fungsi Render Tab (Render Tab Navigasi)
    function renderEmojiTabs(activeCat) {
        const tabsContainer = document.getElementById('emojiTabsContainer');
        const categories = Object.keys(emojiCategories);
        
        tabsContainer.innerHTML = "";
        
        categories.forEach(cat => {
            const btn = document.createElement("div");
            btn.className = `emoji-tab ${currentEmojiCategory === cat ? 'active' : ''}`;
            btn.innerHTML = emojiIcons[cat] || cat.substring(0,1);
            btn.onclick = () => renderEmojiGrid(cat);
            btn.ontouchend = () => {
                // Jika tab berakhir di-klik, panel tidak otomatis menutup (opsional)
                // (Tinggal kelip di-klik akan memicang listener global yang kita matikan di function loadContacts)
                // Jika diingink, panel tetap terbuka (toggleEmojiPanel)
            };
            
            // Efek Visual Aktif
            if(currentEmojiCategory === cat) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

function setupTypingListener() {
    const input = document.getElementById("text");
    input.addEventListener("input", () => {
        if(!currentChatId) return;
        const myDisplayName = document.getElementById("myName").innerText;
        db.ref(`typing/${currentChatId}/${currentUser}`).set(myDisplayName);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => db.ref(`typing/${currentChatId}/${currentUser}`).remove(), 2000);
    });

function updateSummary(msg) {
    const s = { lastMsg: msg.length > 30 ? msg.substring(0,30) + "..." : msg, time: Date.now() };
    if (isGroup) {
        db.ref("group_members/" + currentPartnerId).once("value", snap => {
            snap.forEach(m => db.ref(`user_chats/${m.key}/${currentPartnerId}`).update(s));
        });
    } else {
        db.ref(`user_chats/${currentUser}/${currentPartnerId}`).update(s);
        db.ref(`user_chats/${currentPartnerId}/${currentUser}`).update(s);
    }
}

/* =========================================
    NOTIFIKASI GLOBAL (INTI)
    ========================================= */
function setupGlobalNotificationListener() {
    if (typeof firebase === 'undefined' || typeof db === 'undefined') return;
    if (globalNotifListener) { db.ref(`user_chats/${currentUser}`).off('value', globalNotifListener); }

    globalNotifListener = db.ref(`user_chats/${currentUser}`).on("value", (snap) => {
        snap.forEach((child) => {
            const chatId = child.key.startsWith("GROUP_") ? child.key : [currentUser, child.key].sort().join("_");
            db.ref(`chats/${chatId}`).limitToLast(20).on("child_added", (msgSnap) => {
                const m = msgSnap.val();
                const isRecent = msg.time > (Date.now() - 20000);
                if (m.from !== currentUser && !m.seen && currentChatId !== chatId) {
                    let notifTitle = child.key.startsWith("GROUP_") ? (u?.name || "Grup") : (u?.username || "Teman");
                    let notifBody = "";
                    let soundType = 'message';
                    
                    if (m.text.startsWith("CALL_JITSI:")) {
                        const p = m.text.split(":");
                        const callType = p[1];
                        const roomName = p[2];
                        notifBody = (callType === 'audio') ? "📞 Panggilan Suara..." : "📹 Panggilan Video...";
                        // Jika di layar, tampilkan overlay
                        if (!document.getElementById('videoCallModal').style.display || document.getElementById('videoCallModal').style.display === 'block') {
                            showCallOverlay(roomName, callType, notifTitle, u?.photo);
                        }
                        soundType = 'ringtone';
                    } 
                    else if (m.text.startsWith("IMG:")) { notifBody = "📷 Mengirim Gambar..."; } 
                    else if (m.text.startsWith("TYPE:VN:")) { notifBody = "🎤 Mengirim Voice Note..."; }
                    else { try { notifBody = decryptData(m.text); } catch(e) { notifBody = "Pesan baru"; } }
                    
                    playNotificationSound(soundType);
                    if (document.visibilityState === 'visible') { showAppToast(notifTitle, notifBody, u?.photo, child.key); }
                    showBrowserNotification(notifTitle, notifBody, u?.photo, `chat_${chatId}`);
                }
            });
        });
    });
}

async function handleStart(e) {
    if (e.cancelable) e.preventDefault();
    startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
    isCancelled = false;
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = event => { if (event.data.size > 0) audioChunks.push(event.data); };
        mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());

            if (!isCancelled && audioChunks.length > 0) {
                const vnBlob = new Blob(audioChunks, { type: 'audio/webm' });
                showToast("Mengirim VN...");
                const formData = new FormData(); formData.append('file', vnBlob);
                formData.append('upload_preset', 'hanung'); 
                formData.append('resource_type', 'video'); 
                try {
                    const response = await fetch('https://api.cloudinary.com/v1_1/dwu8dbfjp/video/upload', { method: 'POST', body: formData });
                    const data = await response.json();
                    if (data.secure_url) {
                        const encryptedURL = encryptData(data.secure_url);
                        const finalMessage = "TYPE:VN:" + encryptedURL;
                        db.ref("chats/" + currentChatId).push({ from: currentUser, text: finalMessage, time: Date.now() });
                        showToast("VN Terkirim!");
                    } else { showToast("Gagal upload VN."); }
                } catch (error) { console.error(error); showToast("Error koneksi server."); }
            }
            toggleRecordingUI(false);
        };
        
        mediaRecorder.start();
        toggleRecordingUI(true);
        startTimer();
    } catch (err) {
        console.error(err);
        alert("Akses mic ditolak.");
        toggleRecordingUI(false);
    }

    function toggleRecordingUI(isRecording) {
        const normalInput = document.getElementById("normal-input");
        const recordingUI = document.getElementById("recording-ui");
        const sendButton = document.getElementById("sendButton");
        const micButton = document.getElementById("micButton");

        const isMobile = window.innerWidth <= 768;

        if (isRecording) {
            if (isMobile) {
                if(normalInput) normalInput.style.display = 'none';
                if(sendButton) sendButton.style.display = 'none';
            } else {
                if(normalInput) { normalInput.style.opacity = '0'; normalInput.style.pointerEvents = 'none'; if(sendButton) sendButton.style.display = 'none'; }
            }
            if(recordingUI) recordingUI.style.display = 'flex';
            if(micButton) micButton.style.color = '#ff5e5e';
        } else {
            clearInterval(recordInterval);
            const timerDisplay = document.getElementById('record-timer');
            if(timerDisplay) timerDisplay.innerText = "00:00";
            if(recordingUI) recordingUI.style.display = 'none';
            if (isMobile) { if(normalInput) normalInput.style.display = 'flex'; if(sendButton) sendButton.style.display = 'flex'; }
            else { if(normalInput) { normalInput.style.opacity = '1'; normalInput.style.pointerEvents = 'auto'; if(sendButton) sendButton.style.display = 'block'; }
            if(micButton) micButton.style.color = '';
        }
    }
